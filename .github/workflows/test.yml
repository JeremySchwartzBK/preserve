name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stored captures
        working-directory: platform
        run: node test-captures.mjs
      - name: Links between pages
        working-directory: harness
        run: npm ci --ignore-scripts && node test-link-pages.mjs
      - name: Formulas in our own form
        working-directory: harness
        run: node test-own-forms.mjs
      - name: Viewer and quality check serve the same rules
        working-directory: harness
        run: node test-policy.mjs
      - name: Scripts parse
        run: for f in platform/*.mjs platform/worker/*.mjs harness/*.mjs app/*.js; do node --check "$f" || exit 1; done
