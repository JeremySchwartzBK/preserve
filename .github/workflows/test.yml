name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:   # deploy.yml runs these before any deploy
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stored captures
        working-directory: platform
        run: node test-captures.mjs
      - name: Database rules
        run: bash platform/test-db.sh
      - name: Addresses the runner refuses
        working-directory: platform
        run: node test-address-guard.mjs
      - name: Deleting a Preserve removes its files
        working-directory: platform
        run: node test-delete-files.mjs
      - name: Private review links
        working-directory: platform
        run: node test-review-links.mjs
      - name: How many runners to start
        working-directory: platform/host
        run: node test-scale.mjs
      - name: Alerts
        working-directory: platform/host
        run: node test-alerts.mjs
      - name: Links between pages
        working-directory: harness
        run: npm ci --ignore-scripts && node test-link-pages.mjs
      - name: Formulas in our own form
        working-directory: harness
        run: node test-own-forms.mjs
      - name: Pins apply on both layouts
        working-directory: harness
        run: node test-pins.mjs
      - name: Widgets saved as real content
        working-directory: harness
        run: node test-frames.mjs
      - name: Background video addresses
        working-directory: harness
        run: node test-media-bg.mjs
      - name: Things that move on a timer
        working-directory: harness
        run: node test-ticker.mjs
      - name: Viewer and quality check serve the same rules
        working-directory: harness
        run: node test-policy.mjs
      - name: Scripts parse
        run: for f in platform/*.mjs platform/worker/*.mjs harness/*.mjs app/*.js; do node --check "$f" || exit 1; done
