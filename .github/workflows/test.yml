name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stored captures
        working-directory: platform
        run: node test-captures.mjs
      - name: Scripts parse
        run: for f in platform/*.mjs platform/worker/*.mjs harness/*.mjs app/*.js; do node --check "$f" || exit 1; done
